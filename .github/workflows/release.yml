# Builds the normal edition of VoxelCraft and puts the APK into release/.
# Run it from the Actions tab ("Run workflow"), or push a tag like v2.1.0.
# The preview edition is not built here: preview builds are made and shared in the dev chat.
name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.VC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voxelcraft.jks"
            echo "VC_KEYSTORE=$RUNNER_TEMP/voxelcraft.jks" >> "$GITHUB_ENV"
          else
            echo "No VC_KEYSTORE_BASE64 secret: the APK is signed with a temporary debug key."
          fi

      - name: Build the normal edition
        env:
          VC_KEYSTORE_PASSWORD: ${{ secrets.VC_KEYSTORE_PASSWORD }}
          VC_KEY_ALIAS: ${{ secrets.VC_KEY_ALIAS }}
          VC_KEY_PASSWORD: ${{ secrets.VC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNormalRelease
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release
          cp app/build/outputs/apk/normal/release/app-normal-release.apk "release/VoxelCraft-$VERSION.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-${{ env.VERSION }}
          path: release/VoxelCraft-${{ env.VERSION }}.apk

      - name: Commit it to release/
        run: |
          git config user.name "VoxelCraft release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "release/VoxelCraft-$VERSION.apk"
          git commit -m "Release APK $VERSION (built by GitHub Actions) [skip ci]" || echo "Nothing new to commit"
          git push origin HEAD:master
